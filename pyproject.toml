[project]
name = "wallmap"
version = "0.1.0"
description = "Infer building walls from phone WiFi measurements (research prototype)"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "matplotlib>=3.8",
    "jax>=0.4.30",
    "pyyaml>=6",
]

[dependency-groups]
dev = ["pytest>=8"]

[project.scripts]
solver = "solver.cli:main"
wallmap-sim = "sim.cli:main"
wallmap-eval = "eval.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["common", "sim", "solver", "eval"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
